<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbearia Waldemar WD</title>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<style>

:root{
    --bg:#121212;
    --card:#1c1c1c;
    --primary:#e67e22;
    --text:#ffffff;
    --success:#ff8800;
    --danger:#c0392b;
    --info:#3498db;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background-color:var(--bg);
    color:var(--text);
    font-family:'Segoe UI',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.app-container{
    width:100%;
    max-width:500px;
    height:100vh;
    background:var(--bg);
    position:relative;
    overflow:hidden;
    box-shadow:0 0 50px rgba(0,0,0,0.8);
}

@media (min-width:600px){
    .app-container{
        height:92vh;
        border:6px solid #333;
        border-radius:30px;
    }
}

.screen{
    display:none;
    height:100%;
    padding:20px;
    overflow-y:auto;
}

.screen.active{
    display:block !important;
}

#barra-mensagem{
    display:none;
    background:var(--success);
    color:white;
    padding:12px;
    text-align:center;
    font-weight:bold;
    font-size:14px;
    position:sticky;
    top:0;
    width:100%;
    z-index:2000;
}

#toast-aviso{
    position:absolute;
    top:-100px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    padding:15px;
    border-radius:12px;
    text-align:center;
    font-weight:bold;
    z-index:3000;
    transition:0.5s;
    color:white;
}

#toast-aviso.show{
    top:20px;
}

.login-box{
    margin-top:40px;
    text-align:center;
}

.login-box label{
    display:block;
    text-align:left;
    color:var(--primary);
    font-weight:bold;
    margin-bottom:5px;
    font-size:14px;
}

input{
    width:100%;
    padding:16px;
    background:#2a2a2a;
    border:2px solid #444;
    border-radius:12px;
    color:#fff;
    margin-bottom:20px;
    outline:none;
    font-size:16px;
}

h3{
    color:var(--primary);
    text-align:center;
    margin-bottom:20px;
    font-size:38px;
    font-weight:800;
    text-transform:uppercase;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-bottom:20px;
}

.item{
    background:var(--card);
    padding:15px;
    border-radius:15px;
    text-align:center;
    border:2px solid transparent;
    cursor:pointer;
    transition:0.3s;
    min-height:110px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.item p{
    font-size:13px;
    font-weight:bold;
    margin-top:8px;
    color:#eee;
}

.item.selected{
    border-color:var(--primary);
    background:rgba(230,126,34,0.15);
}

/* IMAGENS DOS SERVIÇOS */

.icone-servico{
    width:150px;
    height:150px;
    object-fit:contain;
}

/* HORÁRIOS */

.time-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.time-slot{
    padding:12px;
    border-radius:8px;
    text-align:center;
    border:2px solid #ff8800;
    color:#fff;
    cursor:pointer;
    font-weight:bold;
}

.time-slot.selected{
    background:var(--info)!important;
    color:white!important;
    border-color:var(--info)!important;
}

.time-slot.occupied{
    background:var(--danger)!important;
    color:white!important;
    border-color:var(--danger)!important;
    cursor:not-allowed;
}

.btn{
    width:100%;
    padding:18px;
    border:none;
    border-radius:12px;
    background:var(--primary);
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
    font-size:16px;
    text-transform:uppercase;
}

.btn-back{
    background:#333;
}

</style>
</head>

<body>

<div class="app-container">

<div id="toast-aviso">Mensagem</div>

<div id="screen-login" class="screen active">

<div class="login-box">

<h3>Barbearia Waldemar</h3>

<label>NOME DO CLIENTE</label>
<input type="text" id="login-user" placeholder="Seu nome">

<label>CELULAR</label>
<input type="tel" id="login-pass" placeholder="82 99999-9999">

<button class="btn" onclick="checkLogin()">
ENTRAR
</button>

</div>
</div>

<!-- PROFISSIONAL -->

<div id="screen-staff" class="screen">

<h3>Profissional</h3>

<div class="grid">


<div class="item" onclick="selSr(this, 'Waldemar')">
<img src="img/Waldemar.png" class="icone-servico">
<p>Waldemar</p>
</div>
    
    <!-- ☝️

<div class="item" onclick="selSt(this, 'Valdemar')">
<span style="font-size:35px;">💈</span>
<p>Valdemar</p>
</div>
-->


    
<div class="item" onclick="selSt(this, 'Outros')">
<span style="font-size:35px;">✂️</span>
<p>Outros</p>
</div>

</div>

<button class="btn btn-back" onclick="nav('screen-login')">
VOLTAR
</button>

</div>

<!-- SERVIÇOS -->

<div id="screen-services" class="screen">

<h3>Serviços</h3>

<div class="grid">


<div class="item" onclick="selSr(this, 'Waldemar')">
<img src="img/Waldemar.png" class="icone-servico">
<p>Waldemar</p>
</div>

    

<div class="item" onclick="selSr(this, 'corte tesoura')">
<img src="img/corte tesoura.png" class="icone-servico">
<p>corte tesoura</p>
</div>

<div class="item" onclick="selSr(this, 'corte a máquina')">
<img src="img/corte a máquina.png" class="icone-servico">
<p>corte a máquina</p>
</div>

<div class="item" onclick="selSr(this, 'corte combo')">
<img src="img/corte combo.png" class="icone-servico">
<p>corte combo</p>
</div>

<div class="item" onclick="selSr(this, 'corte com luzes')">
<img src="img/corte com luzes.png" class="icone-servico">
<p>corte com luzes</p>
</div>

<div class="item" onclick="selSr(this, 'corte pigmentação')">
<img src="img/corte pigmentação.png" class="icone-servico">
<p>corte pigmentação</p>
</div>

<div class="item" onclick="selSr(this, 'corte degradê')">
<img src="img/corte degradê.png" class="icone-servico">
<p>corte degradê</p>
</div>

</div>

<button class="btn btn-back" onclick="nav('screen-staff')">
VOLTAR
</button>

</div>

<!-- AGENDAMENTO -->

<div id="screen-booking" class="screen">

<h3>Agendamento</h3>

<label>DATA</label>

<input type="date" id="book-date">

<div id="time-container" class="time-grid"></div>

<button class="btn">
RESERVAR
</button>

<button class="btn btn-back" onclick="nav('screen-services')">
VOLTAR
</button>

</div>

</div>

<script>

const firebaseConfig = {
    databaseURL:"https://barbearia-valdemar-default-rtdb.firebaseio.com",
    projectId:"barbearia-valdemar"
};

firebase.initializeApp(firebaseConfig);

let sStaff = "";
let sService = "";

function nav(id){

    document.querySelectorAll('.screen')
    .forEach(s => s.classList.remove('active'));

    document.getElementById(id)
    .classList.add('active');

}

function checkLogin(){

    const u =
    document.getElementById('login-user').value;

    const p =
    document.getElementById('login-pass').value;

    if(u !== "" && p.length >= 8){

        nav('screen-staff');

    }else{

        avisar("Dados inválidos!");

    }

}

function avisar(texto){

    const t =
    document.getElementById('toast-aviso');

    t.innerText = texto;

    t.classList.add('show');

    setTimeout(() => {

        t.classList.remove('show');

    },3000);

}

function selSt(el,n){

    sStaff = n;

    document
    .querySelectorAll('#screen-staff .item')
    .forEach(i => i.classList.remove('selected'));

    el.classList.add('selected');

    setTimeout(() => {

        nav('screen-services');

    },300);

}

function selSr(el,s){

    sService = s;

    document
    .querySelectorAll('#screen-services .item')
    .forEach(i => i.classList.remove('selected'));

    el.classList.add('selected');

    setTimeout(() => {

        nav('screen-booking');

    },300);

}

</script>

</body>
</html>
